spring.application.name=repairconnect-api
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/repairconnect_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:repairconnect-development-secret-key-change-me-2026}
app.jwt.expiration-ms=86400000
spring.jackson.serialization.write-dates-as-timestamps=false